# Supabase 무료 티어의 7일 무접속 일시정지를 막는 keep-alive 핑.
# 저장소 Variables에 SUPABASE_URL / SUPABASE_ANON_KEY(공개 anon 키)를 넣으면 동작한다.
name: keepalive

on:
  schedule:
    - cron: "17 3 * * *" # 매일 12:17 KST
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/courses?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "keepalive ok"
