<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결제가 완료되었습니다</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #ffffff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --blue: #0066cc;
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo",
          "Pretendard", "Helvetica Neue", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sf);
    font-size: 17px;
    line-height: 1.6;
    letter-spacing: -0.003em;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  main { max-width: 460px; text-align: center; }
  h1 {
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    font-weight: 600;
    letter-spacing: -0.018em;
    line-height: 1.15;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  p { color: var(--text-2); margin: 0 0 28px; }
  a { color: var(--blue); text-decoration: none; font-size: 1rem; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <h1>결제가 완료되었습니다</h1>
    <p>영수증은 결제 시 입력하신 이메일로 발송됩니다.<br />24시간 안에 연락드려 일정을 잡겠습니다.<br />일정이 맞지 않으면 전액 환불해 드립니다.</p>
    <a href="./">&lsaquo; 처음으로</a>
  </main>
</body>
</html>
