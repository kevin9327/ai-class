<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 — 실무AI클래스</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<link rel="stylesheet" href="./assets/style.css?v=20260905b" />
<script>window.REL = "./";</script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js" defer></script>
<script src="./assets/config.js?v=20260905b" defer></script>
<script src="./assets/lessons.js?v=20260905b" defer></script>
<script src="./assets/app.js?v=20260905b" defer></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="./index.html">실무<b>AI</b>클래스</a>
    <nav class="nav">
      <a href="./lessons.html">무료 강의</a>
      <a href="./index.html#courses">코스</a>
      <a href="./prompts.html">프롬프트</a>
      <a href="./outsourcing.html">외주 의뢰</a>
      <a href="./training.html">기업 교육</a>
      <a href="./index.html#contact">문의</a>
    </nav>
    <form class="search" role="search" action="./prompts.html" method="get" data-search>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" name="q" placeholder="강의·프롬프트 검색" autocomplete="off" aria-label="강의·프롬프트 검색" />
      <div class="search-drop" hidden></div>
    </form>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</header>

<div class="auth-wrap">
  <h1>실무AI클래스 계정</h1>

  <div class="tabbar">
    <button type="button" id="tab-login" class="active">로그인</button>
    <button type="button" id="tab-signup">회원가입</button>
  </div>

  <button type="button" class="btn btn-block btn-lg btn-google" id="google-btn">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6C12.3 13.1 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.8A14.5 14.5 0 0 1 9.5 24c0-1.7.3-3.3.8-4.8l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-3.6-13.6-8.7l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
    Google 계정으로 계속하기
  </button>
  <div class="or-divider"><span>또는 이메일로</span></div>

  <form id="auth-form" class="card" novalidate>
    <div class="field" id="name-field" hidden>
      <label for="auth-name">이름 또는 호칭</label>
      <input type="text" id="auth-name" autocomplete="name" placeholder="김OO 또는 OO대표" />
    </div>
    <div class="field">
      <label for="auth-email">이메일</label>
      <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="auth-password">비밀번호</label>
      <input type="password" id="auth-password" autocomplete="current-password" placeholder="8자 이상" minlength="8" required />
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block" id="auth-submit">로그인</button>
    <p class="status" id="auth-status" role="status" aria-live="polite"></p>
  </form>

  <p class="status" style="margin-top:18px;">
    가입하면 <a href="./privacy.html" style="color:var(--brand);">개인정보처리방침</a>에 동의하는 것으로 봅니다.
  </p>
</div>

</body>
</html>
