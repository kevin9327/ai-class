<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --navy:#0b1b33; --brand:#3182f6; --ink:#0f172a; --ink2:#475569;
         --line:#e2e8f0; --soft:#eef4ff; --paper:#f8fafc; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:675px;overflow:hidden}
  body{font-family:"Pretendard","Malgun Gothic",sans-serif;letter-spacing:-.025em}
  .card{width:1200px;height:675px;background:var(--paper);position:relative;
        display:flex;flex-direction:column;justify-content:center;padding:0 78px;gap:26px}
  .tag{font-size:26px;font-weight:800;color:var(--brand)}
  h1{font-size:60px;font-weight:800;line-height:1.22;color:var(--ink);white-space:pre-line}
  p{font-size:28px;line-height:1.55;color:var(--ink2);max-width:19ch}
  svg.art{position:absolute;right:64px;top:50%;transform:translateY(-50%)}
  .grid{position:absolute;inset:0;
        background-image:linear-gradient(var(--line) 1px,transparent 1px),
                         linear-gradient(90deg,var(--line) 1px,transparent 1px);
        background-size:40px 40px;opacity:.5}
  .bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--brand)}
</style></head>
<body><div id="root"></div>

document.getElementById("root").outerHTML =
  `<div class="card"><div class="grid"></div><div class="bar"></div>
     <div class="tag">${D.tag}</div>

     <p>${D.sub}</p>

</script></body></html>
